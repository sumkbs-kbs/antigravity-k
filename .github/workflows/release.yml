# Release workflow — builds and publishes the package to PyPI on git tags.
# Uses GitHub Trusted Publishing (OIDC) so no long-lived PyPI tokens are stored
# as a repository secret.
#
# Trigger: push a tag matching `v*` (e.g. v0.2.0).
name: "Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build only, do not publish)"
        required: false
        default: "true"

permissions:
  contents: read
  id-token: write  # Required for PyPI Trusted Publishing (OIDC).

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: "Build distributions"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for version inference from tags.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip build "pydantic>=2.10.0,<3.0" "typer>=0.13.0,<1.0"

      - name: Generate release SBOMs and notices
        run: |
          python -m antigravity_k.engine.release_sbom generate \
            --project-root . \
            --release-root src/antigravity_k/release

      - name: Build wheel + sdist
        run: python -m build

      - name: Verify the wheel installs
        run: |
          pip install dist/*.whl
          python -c "import antigravity_k; print('import ok')"

      - name: Verify release SBOMs and notices
        run: |
          python -m antigravity_k.engine.release_sbom verify \
            --distribution-root dist \
            --release-root src/antigravity_k/release \
            --output dist/release-supply-chain.json

      - name: Install provenance verifier
        run: python -m pip install "pydantic>=2.10.0,<3.0" "typer>=0.13.0,<1.0"

      - name: Record and verify release provenance
        run: |
          mkdir -p .artifacts
          python src/antigravity_k/engine/artifact_provenance.py \
            create dist --root . --output .artifacts/release-dist.json
          python src/antigravity_k/engine/artifact_provenance.py \
            verify .artifacts/release-dist.json --root .

      - name: Resolve release provenance task
        if: ${{ vars.AGK_PROVENANCE_API_URL != '' }}
        env:
          AGK_PROVENANCE_API_URL: ${{ vars.AGK_PROVENANCE_API_URL }}
          AGK_PROVENANCE_PIN: ${{ secrets.AGK_PROVENANCE_PIN }}
          CONFIGURED_TASK_ID: ${{ vars.AGK_PROVENANCE_TASK_ID }}
        run: |
          if [ -n "$CONFIGURED_TASK_ID" ]; then
            task_id="$CONFIGURED_TASK_ID"
          else
            task_id=$(scripts/register_artifact_provenance_task.sh build "github-${{ github.run_id }}")
          fi
          echo "AGK_PROVENANCE_TASK_ID=$task_id" >> "$GITHUB_ENV"

      - name: Publish release provenance to task event store
        if: ${{ vars.AGK_PROVENANCE_API_URL != '' }}
        env:
          AGK_PROVENANCE_API_URL: ${{ vars.AGK_PROVENANCE_API_URL }}
          AGK_PROVENANCE_PIN: ${{ secrets.AGK_PROVENANCE_PIN }}
        run: scripts/publish_artifact_provenance.sh .artifacts/release-dist.json build

      - name: Extract version
        id: meta
        run: |
          METADATA=$(python -m antigravity_k.engine.release_metadata \
            --distribution-root dist \
            --git-ref "$GITHUB_REF")
          VERSION=$(printf '%s' "$METADATA" | python -c "import json,sys; print(json.load(sys.stdin)['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            .artifacts/release-dist.json
            dist/release-supply-chain.json
          retention-days: 30

  publish-pypi:
    name: "Publish to PyPI"
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    # Skip publishing on manual dry-run or on non-tag pushes.
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'

    environment:
      name: pypi
      url: https://pypi.org/project/antigravity-k/

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Trusted Publishing requires no password — OIDC handles auth.
          # Configure the trusted publisher at https://pypi.org/manage/account/publishing/
          print-hash: true

  github-release:
    name: "Create GitHub Release"
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
