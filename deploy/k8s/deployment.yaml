apiVersion: apps/v1
kind: Deployment
metadata:
  name: antigravity-k
  namespace: antigravity-k
  labels:
    app.kubernetes.io/name: antigravity-k
spec:
  replicas: 1  # Single replica — the vault uses file-based locking; scale cautiously.
  strategy:
    type: Recreate  # Avoid two pods competing for the same vault volume.
  selector:
    matchLabels:
      app.kubernetes.io/name: antigravity-k
  template:
    metadata:
      labels:
        app.kubernetes.io/name: antigravity-k
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: antigravity-k
          # Replace with your registry/image. Tag follows the git tag.
          image: ghcr.io/mr-k/antigravity-k:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: AGK_ENV
              value: "production"
            # Auth — from Secret.
            - name: AGK_SEC_ACCESS_PIN
              valueFrom:
                secretKeyRef:
                  name: antigravity-k-auth
                  key: AGK_SEC_ACCESS_PIN
            - name: AGK_PATH_VAULT
              value: /app/vault_data
            - name: AGK_PATH_LOGS
              value: /app/logs
          volumeMounts:
            - name: vault-data
              mountPath: /app/vault_data
            - name: logs
              mountPath: /app/logs
            - name: app-data
              mountPath: /app/data
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          # ── probe 역할 분리 (NX-06) ────────────────────────────────────
          # liveness  = 프로세스 생존만 본다. `/health` 는 의존성을 검사하지 않고
          #             항상 200 이므로, 모델 다운로드/로드 같은 긴 초기화가
          #             restart loop 를 만들지 않는다.
          # readiness = 의존성 준비 상태. `/api/ready` 는 required 검사 실패 시
          #             503 을 반환하고, degraded 는 200(트래픽 수용)이다.
          #             → 신규 설치(활성 프로젝트 없음, 모델 미로드)도 서비스된다.
          # startup   = 초기화 완료까지 liveness/readiness 를 유예한다.
          # 세 경로 모두 공개 경로이므로 probe 는 credential 을 갖지 않는다.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness: 필수 의존성(task DB/registry/writable storage)이 준비되었는가.
          # not_ready = 503 → EndpointSlice 에서 제외, degraded = 200 → 수용.
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3  # 약 30초 뒤 endpoint 제외
          # Startup probe — allow generous time for model/ subsystem init.
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30  # up to 5 minutes
      volumes:
        - name: vault-data
          persistentVolumeClaim:
            claimName: antigravity-k-vault
        - name: logs
          emptyDir: {}
        - name: app-data
          persistentVolumeClaim:
            claimName: antigravity-k-data
